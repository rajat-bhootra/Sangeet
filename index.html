<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <title>Sangeet</title>
</head>

<body>
    <div class="container flex">
        <!-- Library -->
        <div class="left rounded ">
            <div class="library rounded">
                <div class="heading">
                    <img class="invert" src="images/library.svg" alt="lib">
                    <h2>Your Library</h2>
                </div>
                <div class="foldername">
                    <h3></h3>
                </div>
                <div class="songlist">
                    <ul></ul>
                </div>
            </div>
        </div>

        <!-- Playlist -->
        <div class="right rounded">
            <div class="logo rounded">
                <img src="images/logo.png" alt="logo">
                <span>SANGEET</span>
            </div>

            <div class="playlist">
                <div class="name">
                    <img class="invert" src="images/playlist.svg" alt="playlist">
                    <span>Playlists</span>
                    <button id="pickFolder">
                        <h5 class="text">Upload Folder</h5>
                    </button>
                    <input type="file" id="fileInput" accept="audio/*" webkitdirectory multiple hidden>
                </div>
                <div class="cardContainer"></div>
            </div>
        </div>

        <!-- Playbar -->
        <div class="playbar">
            <div class="timeline">
                <div class="currenttime"></div>
                <div class="seekbar">
                    <div class="trail"></div>
                    <div class="circle"></div>
                </div>
                <div class="songduration"></div>
            </div>

            <div class="infobar">
                <div class="songinfo"></div>
                <div class="songbutton invert">
                    <img id="prev" src="images/prev.svg" alt="previous">
                    <img id="playing" src="images/play.svg" alt="play">
                    <img id="next" src="images/next.svg" alt="next">
                </div>
                <div class="volume">
                    <img class="invert" src="images/volume.svg" alt="volume">
                    <input class="range" type="range" name="volume" min="0" max="100" value="100">
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
